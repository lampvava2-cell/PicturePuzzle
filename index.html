<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>모바일 퍼즐 게임 - 안내 가이드 에디션</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; user-select: none; -webkit-user-select: none; }
        h2 { color: #333; }
        .controls { margin-bottom: 15px; }
        select, button { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background-color: #0056b3; }
        #puzzle-container {
            display: grid;
            gap: 2px;
            width: 320px;
            height: 320px;
            margin: 20px auto;
            background: #ddd;
            padding: 2px;
            border-radius: 8px;
            position: relative;
        }
        .puzzle-piece {
            background-size: 320px 320px;
            cursor: pointer;
            border: 1px solid #fff;
            box-sizing: border-box;
            touch-action: none;
        }
        .puzzle-piece.dragging { opacity: 0.3; }
        .puzzle-piece.drag-over { border: 3px solid #2ed573; background-color: rgba(46, 213, 115, 0.3); }
        
        #drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.85;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: none;
            border: 2px solid #ff4757;
            box-sizing: border-box;
            background-size: 320px 320px;
        }

        #complete-view { display: none; margin-top: 20px; }
        #complete-view img, #complete-view video { max-width: 320px; width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: block; margin: 0 auto; }
        #reward-title { color: #ff4757; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <h2>그림 맞추기 퍼즐 (안내 가이드 에디션)</h2>
    
    <div class="controls">
        <select id="stageSelect">
            <option value="1">스테이지 1</option>
            <option value="2">스테이지 2</option>
            <option value="3">스테이지 3</option>
        </select>
        <select id="gridSize">
            <option value="3">3 x 3</option>
            <option value="4">4 x 4</option>
            <option value="5">5 x 5</option>
        </select>
        <button type="button" id="startBtn" onclick="preparePuzzle()">게임 시작</button>
    </div>

    <p id="status">스테이지와 난이도를 선택하고 게임 시작을 누르세요.</p>

    <div id="puzzle-container"></div>
    <div id="drag-ghost"></div>

    <div id="complete-view">
        <h3 id="standard-title">🎉 퍼즐 완성! 원본 이미지</h3>
        <h3 id="reward-title">🎁 히든 멀티미디어 보상 등장!</h3>
        
        <div id="media-slot"></div>

        <br><button type="button" id="nextStageBtn" onclick="prepareNextStage()" style="margin-top:15px; display:none;">다음 스테이지로</button>
    </div>

<script>
    let currentImageSrc = "";
    let rewardPathData = "";
    let rewardIsVideo = false;
    let pieces = [];
    let draggedIndex = null;
    let currentSize = 3;
    let currentPieceSize = 106.66;
    let currentStageNum = 1;
    let isPlaying = false;

    const container = document.getElementById('puzzle-container');
    const statusText = document.getElementById('status');
    const completeView = document.getElementById('complete-view');
    const dragGhost = document.getElementById('drag-ghost');
    const standardTitle = document.getElementById('standard-title');
    const rewardTitle = document.getElementById('reward-title');
    const mediaSlot = document.getElementById('media-slot');
    const nextStageBtn = document.getElementById('nextStageBtn');
    const startBtn = document.getElementById('startBtn');

    function loadGameImage(baseName, callback) {
        const extensions = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'bmp'];
        let idx = 0;

        function tryNext() {
            if (idx >= extensions.length) {
                alert(`게임 이미지를 찾을 수 없습니다: ${baseName}`);
                startBtn.disabled = false;
                return;
            }
            let ext = extensions[idx++];
            let path = `${baseName}.${ext}`;
            let img = new Image();
            img.onload = () => callback(path);
            img.onerror = () => tryNext();
            img.src = path;
        }
        tryNext();
    }

    function loadRewardMedia(baseName, callback) {
        const formats = [
            { ext: 'mp4', type: 'video' },
            { ext: 'webm', type: 'video' },
            { ext: 'mov', type: 'video' },
            { ext: 'png', type: 'image' },
            { ext: 'jpg', type: 'image' },
            { ext: 'jpeg', type: 'image' },
            { ext: 'webp', type: 'image' },
            { ext: 'gif', type: 'image' },
            { ext: 'bmp', type: 'image' }
        ];
        let idx = 0;

        function tryNext() {
            if (idx >= formats.length) {
                alert(`보상 미디어를 찾을 수 없습니다: ${baseName}`);
                startBtn.disabled = false;
                return;
            }
            let item = formats[idx++];
            let path = `${baseName}.${item.ext}`;

            if (item.type === 'video') {
                let vid = document.createElement('video');
                vid.onloadedmetadata = () => callback(path, true);
                vid.onerror = () => tryNext();
                vid.src = path;
            } else {
                let img = new Image();
                img.onload = () => callback(path, false);
                img.onerror = () => tryNext();
                img.src = path;
            }
        }
        tryNext();
    }

    let audioCtx = null;
    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playMoveSound() {
        try {
            let ctx = getAudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        } catch(e) {}
    }

    function playWinSound() {
        try {
            let ctx = getAudioContext();
            let notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                let startTime = ctx.currentTime + (index * 0.12);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.2, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            });
        } catch(e) {}
    }

    function preparePuzzle() {
        currentStageNum = parseInt(document.getElementById('stageSelect').value);
        currentSize = parseInt(document.getElementById('gridSize').value);
        
        startBtn.disabled = true;
        statusText.innerText = `스테이지 ${currentStageNum} 리소스를 불러오는 중입니다...`;
        completeView.style.display = "none";
        container.style.display = "none";

        let gameBase = `game${currentStageNum}`;
        let rewardBase = `reward${currentStageNum}`;

        loadGameImage(gameBase, function(gamePath) {
            currentImageSrc = gamePath;
            
            loadRewardMedia(rewardBase, function(rewardPath, isVideo) {
                rewardPathData = rewardPath;
                rewardIsVideo = isVideo;
                
                // 안내 텍스트 적용: 3초 뒤 자동 시작 카운트다운
                let countdown = 3;
                statusText.innerText = `스테이지 ${currentStageNum} 게임이 ${countdown}초 뒤 자동 시작합니다.`;
                
                let timer = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        statusText.innerText = `스테이지 ${currentStageNum} 게임이 ${countdown}초 뒤 자동 시작합니다.`;
                    } else {
                        clearInterval(timer);
                        startBtn.disabled = false;
                        startPuzzle();
                    }
                }, 1000);
            });
        });
    }

    function startPuzzle() {
        getAudioContext();
        container.style.display = "grid";
        isPlaying = true;
        
        container.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
        container.style.gridTemplateRows = `repeat(${currentSize}, 1fr)`;

        currentPieceSize = 320 / currentSize;
        pieces = [];

        for (let r = 0; r < currentSize; r++) {
            for (let c = 0; c < currentSize; c++) {
                pieces.push({
                    correctIndex: r * currentSize + c,
                    bgX: c * currentPieceSize,
                    bgY: r * currentPieceSize
                });
            }
        }

        do {
            pieces.sort(() => Math.random() - 0.5);
        } while (isCompleted());

        renderBoard();
        statusText.innerText = `스테이지 ${currentStageNum} 진행 중 - 조각을 드래그하여 맞추세요.`;
    }

    function renderBoard() {
        container.innerHTML = "";
        pieces.forEach((piece, index) => {
            let div = document.createElement('div');
            div.className = 'puzzle-piece';
            div.style.backgroundImage = `url(${currentImageSrc})`;
            div.style.backgroundPosition = `-${piece.bgX}px -${piece.bgY}px`;
            div.style.width = `${currentPieceSize}px`;
            div.style.height = `${currentPieceSize}px`;
            div.dataset.index = index;

            addTouchAndDragEvents(div, index, piece);
            container.appendChild(div);
        });
    }

    function addTouchAndDragEvents(element, index, piece) {
        let targetElement = null;

        element.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            draggedIndex = index;
            element.classList.add('dragging');

            dragGhost.style.width = `${currentPieceSize}px`;
            dragGhost.style.height = `${currentPieceSize}px`;
            dragGhost.style.backgroundImage = `url(${currentImageSrc})`;
            dragGhost.style.backgroundPosition = `-${piece.bgX}px -${piece.bgY}px`;
            
            let touch = e.touches[0];
            updateGhostPosition(touch.clientX, touch.clientY);
            dragGhost.style.display = 'block';
        }, { passive: true });

        element.addEventListener('touchmove', (e) => {
            if (!isPlaying) return;
            e.preventDefault();
            let touch = e.touches[0];
            updateGhostPosition(touch.clientX, touch.clientY);

            let elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);

            document.querySelectorAll('.puzzle-piece').forEach(el => el.classList.remove('drag-over'));

            if (elemBelow && elemBelow.classList.contains('puzzle-piece')) {
                targetElement = elemBelow;
                targetElement.classList.add('drag-over');
            } else {
                targetElement = null;
            }
        }, { passive: false });

        element.addEventListener('touchend', (e) => {
            if (!isPlaying) return;
            element.classList.remove('dragging');
            dragGhost.style.display = 'none';
            document.querySelectorAll('.puzzle-piece').forEach(el => el.classList.remove('drag-over'));

            if (targetElement && targetElement.dataset.index !== undefined) {
                let dropIndex = parseInt(targetElement.dataset.index);
                if (draggedIndex !== null && draggedIndex !== dropIndex) {
                    let temp = pieces[draggedIndex];
                    pieces[draggedIndex] = pieces[dropIndex];
                    pieces[dropIndex] = temp;

                    playMoveSound();
                    renderBoard();

                    if (isCompleted()) {
                        isPlaying = false;
                        playWinSound();
                        
                        // 안내 텍스트 적용: 클리어 축하 및 보상 대기 안내
                        statusText.innerText = `스테이지 ${currentStageNum} 클리어 축하합니다! 4초 후 숨겨진 보상이 디스플레이 됩니다. 기다려봐요.`;
                        container.style.display = "none";
                        
                        // 1단계: 원본 게임 이미지 4초간 표시
                        standardTitle.style.display = "block";
                        rewardTitle.style.display = "none";
                        mediaSlot.innerHTML = `<img src="${currentImageSrc}" alt="원본 이미지">`;
                        nextStageBtn.style.display = "none";
                        completeView.style.display = "block";
                        completeView.scrollIntoView({ behavior: 'smooth' });

                        // 2단계: 4초 후 보상 미디어로 전환
                        setTimeout(() => {
                            standardTitle.style.display = "none";
                            rewardTitle.style.display = "block";
                            
                            if (rewardIsVideo) {
                                mediaSlot.innerHTML = `<video src="${rewardPathData}" autoplay loop muted playsinline controls></video>`;
                            } else {
                                mediaSlot.innerHTML = `<img src="${rewardPathData}" alt="보상 미디어">`;
                            }

                            statusText.innerText = `🎉 스테이지 ${currentStageNum} 히든 보상 획득 완료!`;
                            if (currentStageNum < 3) {
                                nextStageBtn.style.display = "inline-block";
                            }
                        }, 4000);
                    }
                }
            }
            draggedIndex = null;
        });
    }

    function updateGhostPosition(x, y) {
        dragGhost.style.left = (x - currentPieceSize / 2) + 'px';
        dragGhost.style.top = (y - currentPieceSize / 2) + 'px';
    }

    function isCompleted() {
        return pieces.every((p, i) => p.correctIndex === i);
    }

    function prepareNextStage() {
        if (currentStageNum < 3) {
            currentStageNum++;
            document.getElementById('stageSelect').value = currentStageNum;
            
            // 안내 텍스트 적용: 다음 스테이지 자동 시작 안내
            let countdown = 3;
            completeView.style.display = "none";
            statusText.innerText = `스테이지 ${currentStageNum} 게임이 ${countdown}초 뒤 자동 시작합니다.`;
            
            let gameBase = `game${currentStageNum}`;
            let rewardBase = `reward${currentStageNum}`;

            loadGameImage(gameBase, function(gamePath) {
                currentImageSrc = gamePath;
                loadRewardMedia(rewardBase, function(rewardPath, isVideo) {
                    rewardPathData = rewardPath;
                    rewardIsVideo = isVideo;

                    let timer = setInterval(() => {
                        countdown--;
                        if (countdown > 0) {
                            statusText.innerText = `스테이지 ${currentStageNum} 게임이 ${countdown}초 뒤 자동 시작합니다.`;
                        } else {
                            clearInterval(timer);
                            startPuzzle();
                        }
                    }, 1000);
                });
            });
        }
    }
</script>

</body>
</html>
